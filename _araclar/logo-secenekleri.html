<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<style>
@font-face { font-family: "S"; font-weight: 400 600; src: url(../fonts/schibsted-latin.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: "S"; font-weight: 400 600; src: url(../fonts/schibsted-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA; }
* { box-sizing: border-box; margin: 0; }
body { width: 1600px; background: #e9e9e7; font-family: "S", sans-serif; color: #111; padding: 40px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.card { background: #fff; padding: 0 0 26px; }
.head { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 30px 0; font-size: 15px; color: #777; }
.head b { color: #111; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.hero { height: 230px; display: grid; place-items: center; }
.row { display: grid; grid-template-columns: 1.4fr 1fr 110px; gap: 14px; padding: 0 30px; }
.navbar { border: 1px solid #ddd; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 13px; color: #555; }
.navbar span { display: flex; gap: 16px; }
.dark { background: #111; height: 64px; display: grid; place-items: center; }
.fav { border: 1px solid #ddd; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 12px; color: #555; }
.lock { display: inline-flex; align-items: center; gap: .32em; font-weight: 600; letter-spacing: -.035em; line-height: 1; }
.lock svg { height: .78em; width: auto; display: block; }
</style></head><body><div class="grid" id="g"></div>
<script>
// İşaretler 100x100 kutuda çizilir. c: ana renk, b: zemin rengi
const M = {
  A: (c, b) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${c}"/><rect x="52" y="14" width="34" height="34" fill="${b}"/></svg>`,
  B: (c, b) => `<svg viewBox="0 0 100 100"><rect x="10" y="4" width="15" height="92" fill="${c}"/><path d="M25 62 L60 27 L84 51" fill="none" stroke="${c}" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="10"/><path d="M47 60 L84 96" fill="none" stroke="${c}" stroke-width="15"/></svg>`,
  C: null,
  D: (c, b) => `<svg viewBox="0 0 100 100"><rect x="2" y="2" width="44" height="44" fill="none" stroke="${c}" stroke-width="7"/><rect x="54" y="2" width="44" height="44" fill="${c}"/><rect x="2" y="54" width="44" height="44" fill="none" stroke="${c}" stroke-width="7"/><rect x="54" y="54" width="44" height="44" fill="none" stroke="${c}" stroke-width="7"/></svg>`,
};
// C: yalnızca yazı, "o" harfi yuvarlatılmış kare
const wordC = (c, size) => `<span class="lock" style="font-size:${size}px;color:${c};gap:0">K<svg viewBox="0 0 100 100" style="height:.6em;margin:0 .045em 0 .04em;transform:translateY(.015em)"><rect x="8" y="8" width="84" height="84" rx="24" fill="none" stroke="${c}" stroke-width="16"/></svg>nutra</span>`;
const lock = (k, c, b, size) => k === "C" ? wordC(c, size) : `<span class="lock" style="font-size:${size}px;color:${c}">${M[k](c, b)}Konutra</span>`;
const fav = (k) => k === "C"
  ? `<svg viewBox="0 0 100 100" width="28" height="28"><rect width="100" height="100" rx="18" fill="#111"/><rect x="26" y="26" width="48" height="48" rx="12" fill="none" stroke="#fff" stroke-width="12"/></svg>`
  : `<svg viewBox="0 0 100 100" width="28" height="28"><rect width="100" height="100" fill="${k === "A" ? "#fff" : "#111"}"/><g transform="${k === "A" ? "" : "translate(18 18) scale(.64)"}">${M[k](k === "A" ? "#111" : "#fff", k === "A" ? "#fff" : "#111")}</g></svg>`;
const N = { A: "Pencere", B: "Çatılı K", C: "Kare o", D: "Pafta" };
const D = { A: "Şu anki işaretin incelmiş hali", B: "K harfinin kolu çatı çizgisi gibi kırılır", C: "Yalnızca yazı, o harfi pencere gibi", D: "Dört karelik kat planı ya da pafta" };
document.getElementById("g").innerHTML = Object.keys(N).map((k) => `
  <div class="card">
    <div class="head"><b>${k}. ${N[k]}</b><span>${D[k]}</span></div>
    <div class="hero">${lock(k, "#111", "#fff", 96)}</div>
    <div class="row">
      <div class="navbar">${lock(k, "#111", "#fff", 22)}<span>Ürün Fiyatlar Sorular</span></div>
      <div class="dark">${lock(k, "#f2f2f0", "#111", 26)}</div>
      <div class="fav">${fav(k)}<span>Sekme</span></div>
    </div>
  </div>`).join("");
</script></body></html>
